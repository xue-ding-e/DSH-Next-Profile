name: Prepare installer release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Test installer behavior
        run: pnpm test
      - name: Verify thin package inputs
        run: node scripts/smoke-package.mjs --directory .
      - name: Assemble full installer from locked public plugin assets
        run: node scripts/build-release.mjs --manifest profile/manifest.json --compatibility profile/compatibility.json --output .output/full
      - name: Pack thin installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .output/thin | Out-Null
          npm pack --ignore-scripts --json --pack-destination .output/thin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-release-candidate
          if-no-files-found: error
          path: |
            .output/full/*.zip
            .output/full/*.tgz
            .output/full/SHA256SUMS
            .output/thin/*.tgz
            profile/manifest.json
            profile/compatibility.json
            profile/feature-matrix.json
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = '.output/release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item -Path '.output/full/*.zip', '.output/full/*.tgz', '.output/full/SHA256SUMS', '.output/thin/*.tgz',
            'profile/manifest.json', 'profile/compatibility.json', 'profile/feature-matrix.json' -Destination $releaseDir
          $assets = @(Get-ChildItem -LiteralPath $releaseDir -File | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 7) { throw "Expected release assets are missing from $releaseDir" }
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY `
            --title "DSH Next Profile $env:GITHUB_REF_NAME" `
            --notes "Automated DSH Next Profile release from $env:GITHUB_SHA. Verify SHA256SUMS before installation."
          gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY
