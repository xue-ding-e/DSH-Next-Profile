name: Prepare installer release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Test installer behavior
        run: pnpm test
      - name: Verify thin package inputs
        run: node scripts/smoke-package.mjs --directory .
      - name: Assemble full installer from locked public plugin assets
        run: node scripts/build-release.mjs --manifest profile/manifest.json --compatibility profile/compatibility.json --output .output/full
      - name: Pack thin installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .output/thin | Out-Null
          npm pack --ignore-scripts --json --pack-destination .output/thin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-release-candidate
          if-no-files-found: error
          path: |
            .output/full/*.zip
            .output/full/*.tgz
            .output/full/SHA256SUMS
            .output/thin/*.tgz
            installer/Install-Latest.ps1
            profile/manifest.json
            profile/compatibility.json
            profile/feature-matrix.json
      - name: Create GitHub Release
        shell: pwsh
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_DIR: .output/release
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = $env:RELEASE_DIR
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $packageVersion = (Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json).version
          if ("v$packageVersion" -ne $env:GITHUB_REF_NAME) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }
          $fullFiles = @(Get-ChildItem -File -LiteralPath '.output/full' | Where-Object { $_.Extension -in @('.zip', '.tgz') })
          $thinFiles = @(Get-ChildItem -File -LiteralPath '.output/thin' | Where-Object { $_.Extension -eq '.tgz' })
          if ($fullFiles.Count -ne 2 -or $thinFiles.Count -ne 1) {
            throw "Expected one full ZIP, one full tgz and one thin tgz; found full=$($fullFiles.Count), thin=$($thinFiles.Count)"
          }
          $copyPlan = @(
            $fullFiles | ForEach-Object { [pscustomobject]@{ Source = $_.FullName; AssetName = $_.Name } }
            [pscustomobject]@{ Source = ($fullFiles | Where-Object Extension -eq '.tgz').FullName; AssetName = 'dsh-next-profile.tgz' }
            [pscustomobject]@{ Source = ($fullFiles | Where-Object Extension -eq '.zip').FullName; AssetName = 'dsh-next-profile-windows.zip' }
            [pscustomobject]@{ Source = (Get-Item -LiteralPath 'installer/Install-Latest.ps1').FullName; AssetName = 'Install-Latest.ps1' }
            $thinFiles | ForEach-Object { [pscustomobject]@{ Source = $_.FullName; AssetName = "$($_.BaseName)-thin$($_.Extension)" } }
            [pscustomobject]@{ Source = (Get-Item -LiteralPath 'profile/manifest.json').FullName; AssetName = 'manifest.json' }
            [pscustomobject]@{ Source = (Get-Item -LiteralPath 'profile/compatibility.json').FullName; AssetName = 'compatibility.json' }
            [pscustomobject]@{ Source = (Get-Item -LiteralPath 'profile/feature-matrix.json').FullName; AssetName = 'feature-matrix.json' }
          )
          foreach ($item in $copyPlan) {
            Copy-Item -LiteralPath $item.Source -Destination (Join-Path $releaseDir $item.AssetName)
          }
          $assets = @(Get-ChildItem -LiteralPath $releaseDir -File | Sort-Object Name)
          if ($assets.Count -ne $copyPlan.Count -or (@($copyPlan.AssetName | Sort-Object -Unique).Count -ne $copyPlan.Count) -or (@($assets.Name | Sort-Object -Unique).Count -ne $assets.Count)) {
            throw "Release asset names are incomplete or duplicated in $releaseDir"
          }
          $checksums = @($assets | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }) -join "`n"
          [IO.File]::WriteAllText((Join-Path $releaseDir 'SHA256SUMS'), "$checksums`n", [Text.UTF8Encoding]::new($false))
          $assets = @(Get-ChildItem -LiteralPath $releaseDir -File | Sort-Object Name)
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releasePayload = @{
            tag_name = $env:GITHUB_REF_NAME
            target_commitish = $env:GITHUB_SHA
            name = "DSH Next Profile $env:GITHUB_REF_NAME"
            body = "Automated DSH Next Profile release from $env:GITHUB_SHA. Verify SHA256SUMS before installation."
            draft = $true
            prerelease = $false
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" `
            -Headers $headers -ContentType 'application/json' -Body ([Text.Encoding]::UTF8.GetBytes($releasePayload))
          foreach ($asset in $assets) {
            $uploadBase = $release.upload_url -replace '\{\?.*$',''
            $uploadUri = "${uploadBase}?name=$([uri]::EscapeDataString($asset.Name))"
            Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType 'application/octet-stream' -InFile $asset.FullName | Out-Null
          }
          # Keep /releases/latest on the previous complete installer until every asset is uploaded.
          Invoke-RestMethod -Method Patch -Uri $release.url -Headers $headers -ContentType 'application/json' `
            -Body ([Text.Encoding]::UTF8.GetBytes('{"draft":false,"make_latest":"true"}')) | Out-Null
          Write-Host "Created $($release.html_url) with $($assets.Count) assets."
