name: Prepare installer release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Test installer behavior
        run: pnpm test
      - name: Verify thin package inputs
        run: node scripts/smoke-package.mjs --directory .
      - name: Assemble full installer from locked public plugin assets
        run: node scripts/build-release.mjs --manifest profile/manifest.json --compatibility profile/compatibility.json --output .output/full
      - name: Pack thin installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .output/thin | Out-Null
          npm pack --ignore-scripts --json --pack-destination .output/thin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-release-candidate
          if-no-files-found: error
          path: |
            .output/full/*.zip
            .output/full/*.tgz
            .output/full/SHA256SUMS
            .output/thin/*.tgz
            profile/manifest.json
            profile/compatibility.json
            profile/feature-matrix.json
      - name: Create GitHub Release
        uses: actions/github-script@v7.0.1
        env:
          RELEASE_DIR: .output/release
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const files = directory => fs.readdirSync(directory).map(name => path.join(directory, name))
              .filter(file => fs.statSync(file).isFile())
            const releaseDir = process.env.RELEASE_DIR
            fs.mkdirSync(releaseDir, { recursive: true })
            for (const source of [
              ...files('.output/full').filter(file => /\.(?:zip|tgz)$/u.test(file)),
              '.output/full/SHA256SUMS',
              ...files('.output/thin').filter(file => /\.tgz$/u.test(file)),
              'profile/manifest.json',
              'profile/compatibility.json',
              'profile/feature-matrix.json',
            ]) fs.copyFileSync(source, path.join(releaseDir, path.basename(source)))
            const assets = fs.readdirSync(releaseDir).filter(name => fs.statSync(path.join(releaseDir, name)).isFile())
            if (assets.length < 7) throw new Error(`Expected release assets are missing from ${releaseDir}`)
            const { owner, repo } = context.repo
            const release = await github.rest.repos.createRelease({
              owner, repo, tag_name: context.ref.replace('refs/tags/', ''), target_commitish: context.sha,
              name: `DSH Next Profile ${context.ref.replace('refs/tags/', '')}`,
              body: `Automated DSH Next Profile release from ${context.sha}. Verify SHA256SUMS before installation.`,
              draft: false, prerelease: false,
            })
            for (const name of assets) {
              const data = fs.readFileSync(path.join(releaseDir, name))
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.data.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              })
            }
            core.info(`Created ${release.data.html_url} with ${assets.length} assets.`)
